name: Auto-refresh & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest headlines and videos
        run: python3 scripts/update_feeds.py

      - name: Rebuild static pages
        run: python3 build/build.py

      - name: Commit refreshed content
        run: |
          git config user.name "domain-marketing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Auto-refresh: headlines, videos and pages ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
